<nav aria-label="Menú principal">

    <a href="{% url 'pagina' %}">Desarrollo</a>
    <a href="{% url 'contacto' %}">Información</a>
    <span class="usuario-menu">Hola, {{ request.user.username }}</span>

        <a href="{% url 'usuarios_pdf' %}">Descargar usuarios PDF</a>
